name: Publier UNIMARC Explorer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Récupérer les sources
        uses: actions/checkout@v6
      - name: Préparer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Vérifier les données et générer le site
        run: |
          node scripts/test-data.cjs
          node scripts/build.cjs
          node scripts/prepare-pages.cjs
      - name: Configurer Pages
        uses: actions/configure-pages@v5
      - name: Préparer le déploiement
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Publier
        id: deployment
        uses: actions/deploy-pages@v4
